<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cierre de Año con Feminario</title>
<link rel="icon" href="assets/logo-feminario.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@500;700;800&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/marca.css">
<style>
  #app{ max-width:600px; margin:0 auto; padding:26px 18px 60px; position:relative; }
  .brand-header{ display:flex; justify-content:center; margin-bottom:14px; }
  .brand-header img{ height:46px; width:auto; }
  .progreso{ display:flex; justify-content:center; align-items:center; gap:7px; margin:0 0 16px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:rgba(126,132,174,.25); transition:all .25s; }
  .dot.hecho{ background:var(--lavanda); } .dot.activo{ background:var(--morado); width:26px; border-radius:6px; }
  .paso-txt{ text-align:center; font-size:12px; color:var(--morado-suave); margin:-8px 0 16px; font-weight:600; letter-spacing:.3px; }
  .screen{ animation:entra .45s ease both; }
  @keyframes entra{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
  .kicker{ font-size:12px; font-weight:800; letter-spacing:1.3px; text-transform:uppercase; color:var(--morado); margin-bottom:6px; }
  .titulo{ font-size:28px; margin:0 0 6px; line-height:1.15; }
  .bajada{ font-size:15px; color:var(--morado-oscuro); margin:0 0 6px; }
  .opciones{ display:flex; flex-direction:column; gap:9px; }
  .acciones{ display:flex; gap:10px; }
  .acciones .btn{ margin-top:22px; }
  .acciones .btn.secundario{ width:auto; flex:0 0 auto; padding-left:22px; padding-right:22px; }
  .microcopy{ font-size:13px; color:var(--morado-oscuro); background:rgba(194,203,255,.35); border-radius:14px; padding:12px 16px; margin:14px 0 6px; }
  .error{ color:var(--alerta); font-size:13px; font-weight:600; margin-top:8px; min-height:18px; }
  input[type=email], input[type=tel]{ width:100%; padding:13px 16px; border-radius:16px; border:1.5px solid rgba(126,132,174,.28); font-size:15px; background:rgba(255,255,255,.88); font-family:inherit; color:var(--texto); }
  input[type=email]:focus, input[type=tel]:focus{ outline:none; border-color:var(--morado); box-shadow:0 0 0 3px rgba(126,132,174,.2); }

  /* Foto de perfil (obligatoria) */
  .foto-sube{ display:flex; align-items:center; gap:16px; margin:8px 0 2px; }
  .foto-circulo{ width:96px; height:96px; border-radius:50%; background:rgba(194,203,255,.5); border:2px dashed var(--morado); display:flex; align-items:center; justify-content:center; overflow:hidden; flex:0 0 auto; color:var(--morado); font-weight:800; font-size:13px; text-align:center; }
  .foto-circulo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .consent{ display:flex; gap:10px; align-items:flex-start; margin:18px 0 0; font-size:13px; color:var(--morado-oscuro); font-weight:500; }
  .consent input{ margin-top:3px; width:18px; height:18px; accent-color:var(--morado); flex:0 0 auto; }

  /* Metas */
  .meta-fila{ background:rgba(255,255,255,.7); border:1px solid rgba(126,132,174,.2); border-radius:20px; padding:14px; margin:12px 0; }
  .meta-fila textarea{ min-height:64px; }
  .estados{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .estado{ border:1.5px solid rgba(126,132,174,.28); border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; background:rgba(255,255,255,.7); font-family:inherit; color:var(--texto); }
  .estado.sel{ border-color:var(--morado); background:var(--periwinkle); color:var(--morado-oscuro); font-weight:800; }
  .estado.cumpli.sel{ background:var(--verde); border-color:#9ccf5f; }
  .quitar{ background:none; border:none; color:var(--morado-suave); font-size:12.5px; cursor:pointer; margin-top:8px; font-family:inherit; text-decoration:underline; }
  .cuenta-metas{ text-align:center; font-weight:700; color:var(--morado-oscuro); margin:10px 0 0; }

  /* Montos */
  .monto-wrap{ position:relative; }
  .monto-wrap span{ position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--morado-suave); font-weight:700; }
  .monto-wrap input{ padding-left:32px; }
  .grupo-titulo{ margin:26px 0 0; font-weight:800; color:var(--morado); font-size:14px; display:flex; align-items:center; gap:8px; }
  .grupo-titulo i{ width:12px; height:12px; border-radius:50%; display:inline-block; }
  .subgrupo{ margin:14px 0 0; font-size:12.5px; font-weight:800; color:var(--morado-oscuro); background:rgba(206,162,221,.25); border-radius:12px; padding:8px 12px; }

  /* Panel de balance */
  .hero-balance{ text-align:center; background:linear-gradient(135deg,rgba(194,203,255,.6),rgba(206,162,221,.5)); border-radius:26px; padding:26px 18px 22px; margin:6px 0 16px; }
  .hero-balance .rotulo{ font-size:12.5px; text-transform:uppercase; letter-spacing:1.2px; font-weight:700; color:var(--morado-oscuro); }
  .hero-balance .monto{ font-family:'MuseoModerno',sans-serif; font-size:40px; font-weight:800; color:var(--morado-oscuro); margin:4px 0; letter-spacing:-.5px; }
  .hero-balance .frase{ font-size:14px; color:var(--morado-oscuro); opacity:.9; max-width:380px; margin:0 auto; }
  .stack{ display:flex; width:100%; height:26px; border-radius:12px; overflow:hidden; background:rgba(126,132,174,.14); }
  .stack div{ border-right:2px solid rgba(255,255,255,.8); } .stack div:last-child{ border-right:none; }
  .leyenda{ display:flex; flex-wrap:wrap; gap:8px 16px; margin:12px 0 4px; font-size:12.5px; }
  .leyenda span{ display:flex; align-items:center; gap:6px; font-weight:600; color:var(--morado-oscuro); }
  .leyenda i{ width:11px; height:11px; border-radius:50%; display:inline-block; }
  .medidor{ background:rgba(255,255,255,.72); border-radius:20px; padding:16px 18px; margin:12px 0; border:1px solid rgba(126,132,174,.15); }
  .medidor .fila{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .medidor .nombre{ font-weight:800; font-size:13.5px; color:var(--morado-oscuro); }
  .medidor .valor{ font-family:'MuseoModerno',sans-serif; font-weight:800; font-size:22px; color:var(--morado-oscuro); }
  .barra{ height:10px; border-radius:6px; background:rgba(126,132,174,.16); margin:9px 0 8px; overflow:hidden; }
  .barra b{ display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--periwinkle),var(--morado)); transition:width 1s cubic-bezier(.2,.8,.2,1); width:0; }
  .barra b.verde{ background:linear-gradient(90deg,var(--verde),#9ccf5f); } .barra b.rosa{ background:linear-gradient(90deg,var(--rosa-claro),var(--lavanda)); }
  .medidor .msg{ font-size:13.5px; margin:0; color:var(--texto); }
  .inv-fila{ display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-bottom:1px dashed rgba(126,132,174,.25); }
  .inv-fila:last-child{ border-bottom:0; }

  /* Carta y temas */
  .carta{ min-height:230px; font-size:16px; line-height:1.6; }
  .temas{ display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 0; }
  .tema{ border:1.5px solid rgba(126,132,174,.28); border-radius:999px; padding:9px 15px; font-size:13.5px; font-weight:600; cursor:pointer; background:rgba(255,255,255,.7); font-family:inherit; color:var(--texto); }
  .tema.sel{ border-color:var(--morado); background:linear-gradient(135deg,rgba(194,203,255,.7),rgba(206,162,221,.5)); font-weight:800; color:var(--morado-oscuro); }

  /* Cierre */
  .resumen{ background:rgba(255,255,255,.7); border-radius:20px; padding:16px 18px; margin:12px 0; }
  .resumen q{ font-style:italic; quotes:"“" "”"; }
  .chip{ display:inline-block; font-size:12px; font-weight:800; padding:4px 11px; border-radius:999px; background:rgba(194,203,255,.5); color:var(--morado-oscuro); margin:0 6px 6px 0; }
  .chip.cumpli{ background:var(--verde); } .chip.no{ background:var(--rosa-claro); }
  .cta{ background:linear-gradient(135deg,rgba(206,162,221,.6),rgba(194,203,255,.55)); border-radius:24px; padding:24px 22px; margin:18px 0 0; text-align:center; }
  .cta h3{ font-size:21px; color:var(--morado-oscuro); }
  .toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--morado-oscuro); color:#fff; padding:11px 20px; border-radius:999px; font-size:13.5px; font-weight:600; z-index:300; box-shadow:0 10px 30px rgba(0,0,0,.25); }
</style>
</head>
<body>

<div id="app">
  <div class="brand-header"><img src="assets/logo-feminario.png" alt="Feminario"></div>
  <div id="progreso"></div>
  <div id="vista"></div>
</div>

<script src="assets/config.js"></script>
<script src="assets/confeti.js"></script>
<script>
/* ============================================================
   CIERRE DE AÑO — 4 pasos. Lo que ella escribe se guarda en el navegador y se envía
   al panel de Feminario (Customer Success → Comunidad) con su foto y sus datos.
   ============================================================ */
const CFG = window.CIERRE;
function uid(){ return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
const BAL0 = { ahorro:"", cdt:"", fondos:"", acciones:"", cripto:"", finca:"", pension:"", dolares:"", otras_inv:"", otros_bienes:"", tarjetas:"", creditos:"", otras_deudas:"", ingreso:"", gasto_fijo:"", gasto_var:"", inv_mes:"" };
const S = { id: uid(), nombre:"", email:"", whatsapp:"", foto:"", fotoEnviada:false, consentimiento:false, metas:[{ texto:"", estado:"" }], bal:Object.assign({}, BAL0), carta:"", temas:[], quiere:"" };

function guardarLocal(){
  try{
    const todo = JSON.parse(localStorage.getItem(CFG.STORAGE_KEY) || "{}");
    todo[S.id] = Object.assign({}, S, { fecha: new Date().toISOString() });
    localStorage.setItem(CFG.STORAGE_KEY, JSON.stringify(todo));
  }catch(e){}
}
/* Envía todo lo que lleva al panel. La foto va solo la primera vez. Devuelve true si el panel lo recibió. */
async function enviar(paso){
  guardarLocal();
  if(!CFG.COMUNIDAD_API) return true;
  const quiereVer = [S.temas.length ? "Temas: " + S.temas.join(", ") : "", S.quiere].filter(Boolean).join("\n");
  const payload = { id:S.id, paso, nombre:S.nombre, email:S.email, whatsapp:S.whatsapp, consentimiento:S.consentimiento,
    metas:S.metas.filter(m => m.texto.trim()), balance:S.bal, carta:S.carta, quiereVer };
  if(!S.fotoEnviada) payload.foto = S.foto;
  for(let intento = 0; intento < 2; intento++){
    try{
      const r = await fetch(CFG.COMUNIDAD_API, { method:"POST", headers:{ "Content-Type":"text/plain" }, body:JSON.stringify(payload) });
      const j = await r.json().catch(() => ({}));
      if(r.ok && j.ok){ if(S.foto) S.fotoEnviada = true; return true; }
      if(r.status === 400 || r.status === 413) return false;     // algo de lo que escribió no es válido: no se reintenta
    }catch(e){}
  }
  return false;
}

/* ---------- utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(v){ return Number(String(v||"").replace(/\D/g,"")) || 0; }
function cop(v){ return "$" + Math.round(v).toLocaleString("es-CO"); }
function primerNombre(){ return (S.nombre || "").trim().split(/\s+/)[0] || "tú"; }
function toast(t){ const el = document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), 3200); }

/* ---------- recorrido ---------- */
const PASOS = ["bienvenida","metas","balance","panel","carta","quiero","cierre"];
const PRINCIPALES = ["metas","balance","carta","quiero"];   // los 4 puntos de progreso
let actual = "bienvenida";
const grupoDe = { bienvenida:-1, metas:0, balance:1, panel:1, carta:2, quiero:3, cierre:4 };

function pintarProgreso(){
  const cont = $("#progreso"), g = grupoDe[actual];
  if(g < 0 || g > 3){ cont.innerHTML = ""; return; }
  cont.innerHTML = `<div class="progreso">${PRINCIPALES.map((_,i)=>`<div class="dot ${i<g?"hecho":""} ${i===g?"activo":""}"></div>`).join("")}</div>
    <div class="paso-txt">Paso ${g+1} de 4</div>`;
}
function ir(id, celebrar){
  actual = id; pintarProgreso();
  $("#vista").innerHTML = `<div class="screen">${VISTAS[id]()}</div>`;
  window.scrollTo({ top:0, behavior:"smooth" });
  if(VISTAS_INIT[id]) VISTAS_INIT[id]();
  if(celebrar) setTimeout(() => lanzarConfeti(), 250);
}
function siguiente(celebrar){ ir(PASOS[PASOS.indexOf(actual)+1], celebrar); }
function anterior(){ ir(PASOS[PASOS.indexOf(actual)-1]); }
function btnsNav(opts){
  opts = opts || {};
  return `<div class="acciones">${opts.sinAtras ? "" : `<button class="btn secundario" id="atras" type="button" aria-label="Volver">←</button>`}<button class="btn" id="sig" type="button">${opts.texto || "Siguiente"}</button></div>`;
}
function nav(onNext){
  const a = $("#atras"); if(a) a.addEventListener("click", anterior);
  $("#sig").addEventListener("click", onNext);
}
/* Envía y avanza; si el panel no lo recibe, avisa pero la deja seguir (queda guardado en su navegador) */
async function avanzar(paso, celebrar){
  const b = $("#sig"); const txt = b.textContent; b.disabled = true; b.textContent = "Guardando…";
  const ok = await enviar(paso);
  if(!ok) toast("No pudimos guardar en este momento; sigue, lo reintentamos en el próximo paso.");
  siguiente(celebrar);
}

const VISTAS = {};
const VISTAS_INIT = {};

/* ---------- Foto: se recorta cuadrada desde el centro y se reduce ---------- */
async function procesarFoto(file){
  let bmp;
  try{ bmp = await createImageBitmap(file, { imageOrientation:"from-image" }); }
  catch(e){ bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const w = bmp.width, h = bmp.height, m = Math.min(w, h), L = 480;
  const c = document.createElement("canvas"); c.width = c.height = L;
  c.getContext("2d").drawImage(bmp, (w-m)/2, (h-m)/2, m, m, 0, 0, L, L);
  return c.toDataURL("image/jpeg", 0.82);
}

/* 0 — Bienvenida: sus datos y su foto */
VISTAS.bienvenida = () => `
  <div class="card">
    <div class="kicker">Cierre de año · ${esc(CFG.FECHA_LABEL)}</div>
    <h1 class="titulo">Cerremos el año juntas</h1>
    <p class="bajada">Cuatro pasos cortos para mirar tu año con cariño: tus metas, tu plata hoy, una carta para ti y lo que sueñas con Feminario.</p>
    <p class="suave">No hay respuestas buenas ni malas.</p>
    <label for="nombre">¿Cómo te llamas?</label>
    <input type="text" id="nombre" placeholder="Tu nombre y apellido" autocomplete="name" value="${esc(S.nombre)}">
    <label for="email">Tu correo</label>
    <input type="email" id="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" value="${esc(S.email)}">
    <label for="wa">Tu WhatsApp</label>
    <input type="tel" id="wa" placeholder="+57 300 000 0000" autocomplete="tel" value="${esc(S.whatsapp)}">
    <label>Tu foto <span class="suave">(obligatoria: queremos ponerle cara a nuestra comunidad)</span></label>
    <div class="foto-sube">
      <div class="foto-circulo" id="foto-prev">${S.foto ? `<img src="${S.foto}" alt="Tu foto">` : "Tu foto"}</div>
      <div><button class="btn secundario chico" type="button" id="foto-btn">${S.foto ? "Cambiar foto" : "Subir mi foto"}</button><input type="file" accept="image/*" id="foto-in" hidden></div>
    </div>
    <label class="consent"><input type="checkbox" id="ok" ${S.consentimiento ? "checked" : ""}><span>Acepto que Feminario guarde mis respuestas, mi balance y mi foto para acompañarme y conocer mejor a la comunidad. Solo las ve el equipo de Feminario.</span></label>
    <div class="error" id="err"></div>
    <button class="btn" id="sig" type="button" style="margin-top:8px">Empezar</button>
  </div>`;
VISTAS_INIT.bienvenida = () => {
  $("#foto-btn").addEventListener("click", () => $("#foto-in").click());
  $("#foto-in").addEventListener("change", async e => {
    const f = e.target.files[0]; if(!f) return;
    try{ S.foto = await procesarFoto(f); S.fotoEnviada = false; $("#foto-prev").innerHTML = `<img src="${S.foto}" alt="Tu foto">`; $("#foto-btn").textContent = "Cambiar foto"; $("#err").textContent = ""; }
    catch(err){ $("#err").textContent = "No pudimos leer esa foto, prueba con otra."; }
  });
  const go = async () => {
    const n = $("#nombre").value.trim(), em = $("#email").value.trim().toLowerCase(), wa = $("#wa").value.trim(), err = $("#err");
    if(!n){ err.textContent = "Cuéntanos tu nombre para empezar."; return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){ err.textContent = "Escribe un correo válido."; return; }
    if(wa.replace(/\D/g,"").length < 8){ err.textContent = "Escribe tu WhatsApp, con el indicativo del país."; return; }
    if(!S.foto){ err.textContent = "Falta tu foto: es obligatoria."; return; }
    if(!$("#ok").checked){ err.textContent = "Para continuar, acepta que guardemos tus respuestas."; return; }
    S.nombre = n; S.email = em; S.whatsapp = wa; S.consentimiento = true;
    const b = $("#sig"); b.disabled = true; b.textContent = "Guardando…";
    const ok = await enviar(0);
    if(!ok){ b.disabled = false; b.textContent = "Empezar"; err.textContent = "No pudimos guardar tus datos. Revisa tu conexión e inténtalo de nuevo."; return; }
    siguiente(true);
  };
  $("#sig").addEventListener("click", go);
};

/* 1 — Metas del año: cuáles cumplí y cuáles no */
const ESTADOS = [["cumpli","La cumplí"],["camino","Voy en camino"],["no","No la cumplí"],["cambio","Cambió y quiero otra cosa"]];
function filaMeta(m, i){
  return `<div class="meta-fila" data-i="${i}">
    <textarea data-t placeholder="Una meta de este año, como la dirías en voz alta">${esc(m.texto)}</textarea>
    <div class="estados">${ESTADOS.map(([v,t]) => `<button type="button" class="estado ${v} ${m.estado===v?"sel":""}" data-e="${v}">${t}</button>`).join("")}</div>
    ${S.metas.length > 1 ? `<button type="button" class="quitar" data-q>Quitar esta meta</button>` : ""}
  </div>`;
}
VISTAS.metas = () => `
  <div class="card">
    <div class="kicker">Paso 1</div>
    <h2 class="titulo">Tus metas del año</h2>
    <p class="bajada">¿Qué te propusiste en 2026? Escríbelas y marca cuáles cumpliste y cuáles no. Todo cuenta, también lo que quedó a medias.</p>
    <div id="metas"></div>
    <button type="button" class="btn secundario chico" id="mas" style="margin-top:4px">+ Agregar otra meta</button>
    <p class="cuenta-metas" id="cuenta"></p>
    <div class="error" id="err"></div>
    ${btnsNav({ sinAtras:true, texto:"Seguir" })}
  </div>`;
VISTAS_INIT.metas = () => {
  const cont = $("#metas");
  const leer = () => { cont.querySelectorAll(".meta-fila").forEach(f => { S.metas[+f.dataset.i].texto = $("[data-t]", f).value; }); };
  const cuenta = () => { const ok = S.metas.filter(m => m.estado === "cumpli").length, tot = S.metas.filter(m => m.texto.trim() && m.estado).length; $("#cuenta").textContent = tot ? `Cumpliste ${ok} de ${tot}. Eso es un logro.` : ""; };
  const pintar = () => { cont.innerHTML = S.metas.map(filaMeta).join(""); $("#mas").style.display = S.metas.length >= 6 ? "none" : ""; cuenta(); };
  pintar();
  cont.addEventListener("input", e => { if(e.target.matches("[data-t]")){ leer(); cuenta(); } });
  cont.addEventListener("click", e => {
    const f = e.target.closest(".meta-fila"); if(!f) return; leer();
    if(e.target.dataset.e){ S.metas[+f.dataset.i].estado = e.target.dataset.e; pintar(); if(e.target.dataset.e === "cumpli") lanzarConfeti({ n:70, dur:1800 }); }
    if(e.target.hasAttribute("data-q")){ S.metas.splice(+f.dataset.i, 1); pintar(); }
  });
  $("#mas").addEventListener("click", () => { leer(); if(S.metas.length < 6){ S.metas.push({ texto:"", estado:"" }); pintar(); } });
  nav(() => {
    leer(); const llenas = S.metas.filter(m => m.texto.trim());
    if(!llenas.length){ $("#err").textContent = "Escribe al menos una meta, aunque sea corta."; return; }
    if(llenas.some(m => !m.estado)){ $("#err").textContent = "Marca cómo te fue con cada meta."; return; }
    S.metas = llenas; avanzar(1, true);
  });
};

/* 2 — Mini balance (con inversiones en detalle) */
function campoMonto(id, label){
  return `<label for="${id}">${label}</label><div class="monto-wrap"><span>$</span><input type="text" inputmode="numeric" id="${id}" placeholder="0" value="${S.bal[id] ? num(S.bal[id]).toLocaleString("es-CO") : ""}"></div>`;
}
VISTAS.balance = () => `
  <div class="card">
    <div class="kicker">Paso 2</div>
    <h2 class="titulo">Tu mini balance</h2>
    <p class="bajada">Una foto de tu plata hoy. Con números aproximados está perfecto.</p>
    <div class="grupo-titulo"><i style="background:var(--morado)"></i>Lo que tengo</div>
    ${campoMonto("ahorro","Ahorros y efectivo disponible")}
    <div class="subgrupo">Mis inversiones</div>
    ${campoMonto("cdt","CDT y renta fija")}
    ${campoMonto("fondos","Fondos de inversión")}
    ${campoMonto("acciones","Acciones y ETF")}
    ${campoMonto("cripto","Criptomonedas")}
    ${campoMonto("finca","Finca raíz")}
    ${campoMonto("pension","Pensión voluntaria o cesantías invertidas")}
    ${campoMonto("dolares","Dólares u oro")}
    ${campoMonto("otras_inv","Otras inversiones")}
    <div class="subgrupo">Otros bienes</div>
    ${campoMonto("otros_bienes","Casa, carro, negocio…")}
    <div class="grupo-titulo"><i style="background:var(--alerta)"></i>Lo que debo</div>
    ${campoMonto("tarjetas","Tarjetas de crédito")}
    ${campoMonto("creditos","Créditos y préstamos (libre inversión, vehículo, vivienda, estudio)")}
    ${campoMonto("otras_deudas","Otras deudas (familia, amigas, fiado)")}
    <div class="grupo-titulo"><i style="background:var(--verde);border:1px solid #b8d97a"></i>Mi mes a mes</div>
    ${campoMonto("ingreso","Lo que entra al mes")}
    ${campoMonto("gasto_fijo","Gastos fijos (vivienda, servicios, cuotas)")}
    ${campoMonto("gasto_var","Gastos variables (mercado, salidas, antojos)")}
    ${campoMonto("inv_mes","Lo que ahorro o invierto cada mes")}
    <div class="microcopy">Si algo no aplica, déjalo en blanco. Estos números los ve solo el equipo de Feminario, para acompañarte mejor.</div>
    <div class="error" id="err"></div>
    ${btnsNav({ texto:"Ver mi foto de hoy" })}
  </div>`;
VISTAS_INIT.balance = () => {
  Object.keys(S.bal).forEach(k => {
    const el = document.getElementById(k); if(!el) return;
    el.addEventListener("input", () => { const n = num(el.value); el.value = n ? n.toLocaleString("es-CO") : ""; S.bal[k] = String(n); });
  });
  nav(() => {
    if(!Object.values(S.bal).some(v => num(v))){ $("#err").textContent = "Llena al menos un campo para armar tu panel."; return; }
    avanzar(2, true);
  });
};

/* 3 — Panel: así estás hoy */
const INV = [["cdt","CDT y renta fija"],["fondos","Fondos"],["acciones","Acciones y ETF"],["cripto","Cripto"],["finca","Finca raíz"],["pension","Pensión voluntaria"],["dolares","Dólares u oro"],["otras_inv","Otras"]];
function calcular(){
  const b = S.bal, n = k => num(b[k]);
  const ah = n("ahorro"), inv = INV.reduce((t,[k]) => t + n(k), 0), ot = n("otros_bienes"), de = n("tarjetas") + n("creditos") + n("otras_deudas");
  const ing = n("ingreso"), ga = n("gasto_fijo") + n("gasto_var"), activos = ah + inv + ot;
  const tipos = INV.filter(([k]) => n(k) > 0).map(([k,t]) => ({ t, v:n(k) })).sort((a,c) => c.v - a.v);
  return { ah, inv, ot, de, ing, ga, activos, patrimonio: activos - de, invMes: n("inv_mes"), tipos,
    colchon: ga > 0 ? ah / ga : null, tasa: ing > 0 ? (ing - ga) / ing : null,
    deudaPct: activos > 0 ? de / activos : (de > 0 ? 1 : 0), invPct: activos > 0 ? inv / activos : 0, aportePct: ing > 0 ? n("inv_mes") / ing : null };
}
const fraseHero = c => c.patrimonio < 0 ? "Hoy debes más de lo que tienes, y está bien saberlo: ver el número es el primer paso para moverlo."
  : c.patrimonio === 0 ? "Estás en el punto de partida. Desde aquí todo suma." : "Esto es lo que has construido. Cada peso que ves aquí tiene tu esfuerzo.";
const msgColchon = m => m === null ? "Cuéntanos lo que gastas al mes y calculamos cuántos meses de tranquilidad tienes."
  : m < 1 ? "Tu primer gran paso: llegar a 1 mes de colchón. Se construye de a poquito." : m < 3 ? "Ya tienes una base. La meta ahora: llegar a 3 meses."
  : m < 6 ? "Vas muy bien: estás cerca de los 6 meses, el colchón que da tranquilidad real." : "Tienes un colchón sólido. Ahora tu plata puede empezar a trabajar para ti.";
const msgTasa = t => t === null ? "Cuéntanos lo que entra al mes para ver cuánto te queda." : t < 0 ? "Este mes sale más de lo que entra. Es información, no culpa: es justo lo que vamos a ajustar."
  : t < .1 ? "Te queda un poquito. Subir ese porcentaje, aunque sea 2 puntos, cambia el año que viene." : t < .2 ? "Vas bien: una parte de lo que entra ya se queda contigo." : "Qué bien: te queda el 20% o más. Eso es disciplina.";
const msgDeuda = (d, c) => c.de === 0 ? "Sin deudas: qué libertad. Tu plata es toda tuya." : d < .3 ? "Tus deudas son manejables frente a lo que tienes. Con un plan se van rápido."
  : d < .6 ? "Hay deuda, pero también hay base. Ordenarla por tasa de interés es el mejor primer paso." : "Las deudas pesan frente a lo que tienes. Un plan de salida paso a paso lo cambia todo.";
function msgInversion(c){
  if(!c.inv) return "Aún no tienes inversiones, y está bien: empezar con poquito y con constancia ya te pone en marcha.";
  const top = c.tipos[0], conc = top.v / c.inv;
  if(c.tipos.length === 1) return `Todo tu portafolio está en ${top.t}. Más adelante vale la pena sumar otra opción para repartir el riesgo.`;
  if(conc > .7) return `Tienes ${c.tipos.length} tipos de inversión, pero el ${Math.round(conc*100)}% está en ${top.t}. Repartir un poco más te da más tranquilidad.`;
  return `Tienes ${c.tipos.length} tipos de inversión y están bien repartidos. Eso es un portafolio pensado.`;
}
VISTAS.panel = () => {
  const c = calcular(), tot = c.activos || 1, pct = x => Math.max(0, Math.min(100, x));
  return `
  <div class="card">
    <div class="kicker">Tu foto de hoy</div>
    <h2 class="titulo">Así estás hoy, ${esc(primerNombre())}</h2>
    <div class="hero-balance"><div class="rotulo">Mi patrimonio hoy</div><div class="monto">${c.patrimonio < 0 ? "-" : ""}${cop(Math.abs(c.patrimonio))}</div><p class="frase">${fraseHero(c)}</p></div>
    ${c.activos > 0 ? `
      <div class="stack"><div style="width:${c.ah/tot*100}%;background:var(--morado)"></div><div style="width:${c.inv/tot*100}%;background:var(--lavanda)"></div><div style="width:${c.ot/tot*100}%;background:var(--periwinkle)"></div></div>
      <div class="leyenda"><span><i style="background:var(--morado)"></i>Ahorros ${cop(c.ah)}</span><span><i style="background:var(--lavanda)"></i>Inversiones ${cop(c.inv)}</span><span><i style="background:var(--periwinkle)"></i>Otros ${cop(c.ot)}</span>${c.de ? `<span><i style="background:var(--alerta)"></i>Deudas −${cop(c.de)}</span>` : ""}</div>` : ""}
    <div class="medidor"><div class="fila"><span class="nombre">Mi colchón</span><span class="valor">${c.colchon === null ? "—" : c.colchon.toFixed(1).replace(".0","") + " meses"}</span></div>
      <div class="barra"><b data-w="${c.colchon === null ? 0 : pct(c.colchon/6*100)}"></b></div><p class="msg">${msgColchon(c.colchon)}</p></div>
    <div class="medidor"><div class="fila"><span class="nombre">Lo que me queda cada mes</span><span class="valor">${c.tasa === null ? "—" : Math.round(c.tasa*100) + "%"}</span></div>
      <div class="barra"><b class="verde" data-w="${c.tasa === null ? 0 : pct(c.tasa/.2*100)}"></b></div><p class="msg">${msgTasa(c.tasa)}</p></div>
    <div class="medidor"><div class="fila"><span class="nombre">Mis deudas frente a lo que tengo</span><span class="valor">${c.de === 0 ? "0%" : (c.deudaPct > 1 ? "100%+" : Math.round(c.deudaPct*100) + "%")}</span></div>
      <div class="barra"><b class="rosa" data-w="${pct(c.deudaPct*100)}"></b></div><p class="msg">${msgDeuda(c.deudaPct, c)}</p></div>
    <div class="medidor"><div class="fila"><span class="nombre">Lo que tengo invertido</span><span class="valor">${c.inv ? Math.round(c.invPct*100) + "%" : "—"}</span></div>
      <div class="barra"><b data-w="${pct(c.invPct*100)}"></b></div>
      ${c.tipos.length ? c.tipos.map(x => `<div class="inv-fila"><span>${x.t}</span><b>${cop(x.v)} · ${Math.round(x.v/c.inv*100)}%</b></div>`).join("") : ""}
      <p class="msg" style="margin-top:8px">${msgInversion(c)}${c.aportePct !== null && c.invMes ? ` Cada mes apartas ${cop(c.invMes)}, el ${Math.round(c.aportePct*100)}% de lo que entra.` : ""}</p></div>
    ${btnsNav({ texto:"Seguir" })}
  </div>`;
};
VISTAS_INIT.panel = () => {
  setTimeout(() => document.querySelectorAll(".barra b").forEach(b => b.style.width = b.dataset.w + "%"), 150);
  nav(() => siguiente(true));
};

/* 4 — Carta a mi yo del 2027 */

  <div class="card">

    <p class="bajada">Mírate dentro de un año. ¿Cómo te imaginas? Cómo está tu plata, cómo te sientes y qué decisiones tomaste para llegar ahí.</p>

/* 5 — ¿Qué te gustaría ver en Feminario? */
const TEMAS = ["Invertir","Salir de deudas","Presupuesto y ahorro","Emprender","Plata en pareja","Mi retiro","Plata y maternidad","Impuestos","La Femiapp","Más comunidad"];
VISTAS.quiero = () => `
  <div class="card">
    <div class="kicker">Paso 4</div>
    <h2 class="titulo">¿Qué te gustaría ver en Feminario?</h2>
    <p class="bajada">Feminario se construye con ustedes. Cuéntanos qué te falta y qué sueñas encontrar aquí.</p>
    <label>Temas que te interesan <span class="suave">(elige los que quieras)</span></label>
    <div class="temas" id="temas">${TEMAS.map(t => `<button type="button" class="tema ${S.temas.includes(t) ? "sel" : ""}" data-t="${esc(t)}">${t}</button>`).join("")}</div>
    <label for="quiere">Cuéntanos con tus palabras</label>
    <textarea id="quiere" placeholder="Cursos, retos, invitadas, funciones de la app, encuentros… lo que se te ocurra.">${esc(S.quiere)}</textarea>
    <div class="error" id="err"></div>
    ${btnsNav({ texto:"Ver mi cierre" })}
  </div>`;
VISTAS_INIT.quiero = () => {
  $("#temas").addEventListener("click", e => { const t = e.target.dataset.t; if(!t) return; e.target.classList.toggle("sel"); S.temas = S.temas.includes(t) ? S.temas.filter(x => x !== t) : S.temas.concat(t); });
  nav(() => {
    S.quiere = $("#quiere").value.trim();
    if(!S.temas.length && !S.quiere){ $("#err").textContent = "Elige un tema o cuéntanos algo, lo que sea nos sirve."; return; }
    avanzar(4, true);

};

/* 6 — Cierre */
VISTAS.cierre = () => {
  const ok = S.metas.filter(m => m.estado === "cumpli").length, c = calcular();
  return `
  <div class="card">
    <div class="kicker">Tu cierre de año</div>
    <h1 class="titulo">Lo lograste, ${esc(primerNombre())}</h1>
    <p class="bajada">Miraste tu año de frente. Eso ya es cuidarte.</p>
    <div class="resumen"><h3>Tus metas</h3><p style="margin:0 0 8px">Cumpliste <b>${ok}</b> de <b>${S.metas.length}</b>.</p>
      ${S.metas.map(m => `<div><span class="chip ${m.estado}">${(ESTADOS.find(x => x[0] === m.estado) || ["",""])[1]}</span> ${esc(m.texto)}</div>`).join("")}</div>
    <div class="resumen"><h3>Tu foto de hoy</h3><p style="margin:0">Patrimonio de <b>${c.patrimonio < 0 ? "-" : ""}${cop(Math.abs(c.patrimonio))}</b>${c.inv ? `, con <b>${cop(c.inv)}</b> invertidos` : ""}.</p></div>
    <div class="resumen"><h3>Tu carta a 2027</h3><p style="margin:0"><q>${esc(S.carta.length > 220 ? S.carta.slice(0, 220) + "…" : S.carta)}</q></p></div>
    <div class="cta">
      <h3>Llegar es más fácil acompañada</h3>
      <p style="margin:0 0 4px">Lo que sueñas para 2027 tiene camino, y Feminario es ese camino: aprendes, practicas y avanzas paso a paso con otras mujeres.</p>
      <a class="btn" href="${esc(CFG.LINK_CATALOGO)}" target="_blank" rel="noopener">Dar mi siguiente paso con Feminario</a>
    </div>
    <p class="suave" style="text-align:center;margin:16px 0 0">Gracias por compartir, ${esc(primerNombre())}. Nos vemos el ${esc(CFG.FECHA_LABEL)}.</p>
  </div>`;
};
VISTAS_INIT.cierre = () => { setTimeout(() => lanzarConfeti({ n:220, dur:4200 }), 500); };

ir("bienvenida");
